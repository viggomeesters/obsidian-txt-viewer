<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TXT Viewer</title>
  <desc id="desc">A stylized read-only text viewer with line numbers and search.</desc>
  <rect width="1200" height="360" fill="#111827"/>
  <rect x="80" y="54" width="1040" height="252" rx="8" fill="#f8fafc"/>
  <rect x="80" y="54" width="1040" height="44" rx="8" fill="#e5e7eb"/>
  <circle cx="108" cy="76" r="7" fill="#ef4444"/>
  <circle cx="132" cy="76" r="7" fill="#f59e0b"/>
  <circle cx="156" cy="76" r="7" fill="#22c55e"/>
  <text x="92" y="144" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">1</text>
  <text x="92" y="184" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">2</text>
  <text x="92" y="224" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">3</text>
  <text x="146" y="144" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">TXT Viewer keeps plain text inspectable.</text>
  <text x="146" y="184" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Line numbers, search, filters, refresh.</text>
  <text x="146" y="224" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Read-only by design.</text>
  <rect x="820" y="117" width="210" height="44" rx="6" fill="#dbeafe"/>
  <text x="848" y="146" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="19" font-weight="700">Search: 3 matches</text>
  <rect x="820" y="176" width="160" height="44" rx="6" fill="#dcfce7"/>
  <text x="848" y="205" fill="#166534" font-family="Arial, sans-serif" font-size="19" font-weight="700">Wrap on</text>
</svg>
