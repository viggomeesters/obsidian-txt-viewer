<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">TXT Viewer preview</title>
  <desc id="desc">Preview of a text viewer with a toolbar, summary pills, warnings, and line-numbered content.</desc>
  <rect width="1100" height="660" fill="#f1f5f9"/>
  <rect x="42" y="34" width="1016" height="592" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">sample.txt</text>
  <text x="72" y="110" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">exports/sample.txt</text>
  <rect x="620" y="64" width="156" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="646" y="85" fill="#334155" font-family="Arial, sans-serif" font-size="15">Search</text>
  <rect x="790" y="64" width="74" height="32" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="808" y="85" fill="#075985" font-family="Arial, sans-serif" font-size="15">Text</text>
  <rect x="872" y="64" width="82" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="891" y="85" fill="#334155" font-family="Arial, sans-serif" font-size="15">Filter</text>
  <line x1="72" y1="132" x2="1028" y2="132" stroke="#e2e8f0"/>
  <rect x="72" y="154" width="90" height="28" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="92" y="173" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">128 lines</text>
  <rect x="174" y="154" width="96" height="28" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="194" y="173" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">LF endings</text>
  <rect x="282" y="154" width="78" height="28" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="302" y="173" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">wrap on</text>
  <rect x="72" y="204" width="956" height="360" rx="6" fill="#0f172a"/>
  <text x="96" y="246" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">1</text>
  <text x="96" y="286" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">2</text>
  <text x="96" y="326" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">3</text>
  <text x="150" y="246" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Plain text is easier to scan with line numbers.</text>
  <text x="150" y="286" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Search navigation keeps repeated terms visible.</text>
  <text x="150" y="326" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Filter mode preserves original line references.</text>
</svg>
